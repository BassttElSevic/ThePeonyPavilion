planet.thepeonypavilion-aldebaran.name = Aldebaran
planet.thepeonypavilion-aldebaran.description = An orange giant star, the brightest in the constellation Taurus. Host star of the Peony Pavilion system.
planet.thepeonypavilion-peony-pavilion.name = The Peony Pavilion
planet.thepeonypavilion-peony-pavilion.description = A blue and green planet. Scans indicate the presence of a hostile rogue AI.
sector.thepeonypavilion-crash-site.name = Crash Site
sector.thepeonypavilion-crash-site.description = Your fleet crashed here. Debris is scattered around, and enemies are closing in... Your journey begins here.

# ============================================
# Items (key format: item.thepeonypavilion-<name>.name / .description)
# ============================================

# -- Variant items (sp- prefix, independent versions of vanilla resources) --
item.thepeonypavilion-sp-lead.name = Lead
item.thepeonypavilion-sp-lead.description = A dense, heavy metal with a low melting point. Excellent at absorbing radiation, often used in power systems and radiation shielding.
item.thepeonypavilion-sp-graphite.name = Graphite
item.thepeonypavilion-sp-graphite.description = An allotrope of carbon: tough, radiation-resistant, corrosion-resistant and heat-resistant. Widely used in metallurgy, machinery, electronics and military industry.
item.thepeonypavilion-sp-titanium.name = Titanium
item.thepeonypavilion-sp-titanium.description = A strong yet lightweight metal with excellent physical properties and a wide range of uses.
item.thepeonypavilion-sp-thorium.name = Thorium
item.thepeonypavilion-sp-thorium.description = A soft, chemically reactive radioactive metal. Higher energy density than uranium with better safety; mainly used in nuclear facilities or alloys.
item.thepeonypavilion-sp-silicon.name = Silicon
item.thepeonypavilion-sp-silicon.description = An extremely common element with excellent semiconductor properties. Indispensable in power systems, electronics and computing.
item.thepeonypavilion-sp-metaglass.name = Metaglass
item.thepeonypavilion-sp-metaglass.description = Glass reinforced with lead, mainly used in fluid transport and special equipment.
item.thepeonypavilion-sp-plastanium.name = Plastanium
item.thepeonypavilion-sp-plastanium.description = A combination of titanium and organic polymers. Light, corrosion-resistant and insulating; used in power systems, computers and insulated equipment.
item.thepeonypavilion-sp-blast-compound.name = Blast Compound
item.thepeonypavilion-sp-blast-compound.description = A class of normally stable explosives, vital to mining and military industry.
item.thepeonypavilion-sp-coal.name = Coal
item.thepeonypavilion-sp-coal.description = A combustible mineral buried in the earth; the most important early fuel source.
item.thepeonypavilion-sp-sand.name = Sand
item.thepeonypavilion-sp-sand.description = Fine mineral grains scattered across the surface, used in smelting and construction.
item.thepeonypavilion-sp-scrap.name = Scrap
item.thepeonypavilion-sp-scrap.description = Ancient remains of buildings, factories, weapons and equipment. Small amounts of valuable raw materials can be extracted from it.

# -- New items (not in vanilla, unique to Peony Pavilion) --
# Basic
item.thepeonypavilion-iron.name = Iron
item.thepeonypavilion-iron.description = A hard, magnetic common metal, widely used in the structure of buildings.
item.thepeonypavilion-cobalt.name = Cobalt
item.thepeonypavilion-cobalt.description = Slightly brittle but stronger than iron; used in transport systems and most alloys.
item.thepeonypavilion-gold.name = Gold
item.thepeonypavilion-gold.description = A soft yellow precious metal with good conductivity, used in power systems and precision components.
item.thepeonypavilion-uranium.name = Uranium
item.thepeonypavilion-uranium.description = An extremely dense radioactive metal. Mildly radioactive when unrefined; used in fortifications and high-strength facilities.
item.thepeonypavilion-iridium.name = Iridium
item.thepeonypavilion-iridium.description = (description not yet written in design doc)
# Crafted
item.thepeonypavilion-steel.name = Steel
item.thepeonypavilion-steel.description = An iron-carbon alloy with high hardness and toughness, extremely versatile.
item.thepeonypavilion-magnet.name = Magnet
item.thepeonypavilion-magnet.description = A permanent magnetic alloy made from iron and cobalt, vital in magnetic applications.
item.thepeonypavilion-computer-chip.name = Computer Chip
item.thepeonypavilion-computer-chip.description = A small chip indispensable to almost all complex devices; can also improve the efficiency of some equipment.
item.thepeonypavilion-shinstar-alloy.name = Shinstar Alloy
item.thepeonypavilion-shinstar-alloy.description = A high-strength alloy of steel, cobalt and titanium. Light yet extremely hard, able to withstand immense impact and pressure. Used in military industry, special equipment, and most importantly -- starship construction.
item.thepeonypavilion-raindawn-salt.name = Raindawn Salt
item.thepeonypavilion-raindawn-salt.description = A high-energy substance discovered by accident, synthesized from uranium, thorium and graphite. Extremely dense energy, excellent storage properties; suited for high-energy weapons, power generation and storage.
item.thepeonypavilion-sunshine-crystal-lattice.name = Sunshine Crystal Lattice
item.thepeonypavilion-sunshine-crystal-lattice.description = Weaving lead, silicon and gold together produces this shimmering, lattice-like material with many wondrous properties. Used in projection, shield devices and high-energy weapons.
item.thepeonypavilion-autocannon-ammo.name = Autocannon Ammo
item.thepeonypavilion-autocannon-ammo.description = Standard ammo boxes for light and rapid-fire weapons, far outperforming ordinary material ammunition.
item.thepeonypavilion-artillery-ammo.name = Artillery Ammo
item.thepeonypavilion-artillery-ammo.description = Standard ammo boxes for heavy and lobbed weapons, far outperforming ordinary material ammunition.
item.thepeonypavilion-missile-ammobox.name = Missile Ammo
item.thepeonypavilion-missile-ammobox.description = Standard ammo boxes for heavy and missile weapons, far outperforming ordinary material ammunition.
item.thepeonypavilion-uranium-fuelrod.name = Uranium Fuel Rod
item.thepeonypavilion-uranium-fuelrod.description = Purified high-concentration uranium sealed in lead to block radiation. Used in nuclear facilities or high-energy weapons and equipment.
item.thepeonypavilion-thorium-fuelrod.name = Thorium Fuel Rod
item.thepeonypavilion-thorium-fuelrod.description = Purified high-concentration thorium sealed in lead to block radiation. Higher energy density than uranium fuel rods.
item.thepeonypavilion-lead-capacitor.name = Lead Capacitor
item.thepeonypavilion-lead-capacitor.description = A small one-time capacitor for cross-region power transmission; also used in some weapons.
item.thepeonypavilion-nuclear-capacitor.name = Nuclear Capacitor
item.thepeonypavilion-nuclear-capacitor.description = A medium one-time capacitor for cross-region power transmission; also used in some weapons.
item.thepeonypavilion-super-capacitor.name = Super Capacitor
item.thepeonypavilion-super-capacitor.description = A large one-time capacitor for cross-region power transmission; also used in some weapons.
item.thepeonypavilion-data-unit.name = Data Unit
item.thepeonypavilion-data-unit.description = A storage device holding recovered data, used to restore technologies in the database.
item.thepeonypavilion-advanced-data-unit.name = Advanced Data Unit
item.thepeonypavilion-advanced-data-unit.description = A storage device holding complex recovered data, used to restore advanced technologies in the database.
# Natural
item.thepeonypavilion-salt.name = Salt
item.thepeonypavilion-salt.description = Salty mineral crystals, widely found on the surface and in veins.
item.thepeonypavilion-wood.name = Wood
item.thepeonypavilion-wood.description = The lignified tissue of plants. Used for simple structures or fuel; can also yield ethanol through biochemical reactions.
item.thepeonypavilion-sulfide.name = Sulfide
item.thepeonypavilion-sulfide.description = A sulfur-rich mineral, a key ingredient in manufacturing explosives.
item.thepeonypavilion-crystal.name = Crystal
item.thepeonypavilion-crystal.description = Natural crystals mainly composed of silica; can be refined directly into high-quality silicon.
item.thepeonypavilion-ice.name = Ice
item.thepeonypavilion-ice.description = Water frozen solid by low temperatures; simple heating yields usable water.

# ============================================
# Liquids (key format: liquid.thepeonypavilion-<name>.name / .description)
# ============================================

# -- Variant liquids (sp- prefix) --
liquid.thepeonypavilion-sp-water.name = Water
liquid.thepeonypavilion-sp-water.description = The source of life; almost every smelting and cooling process requires it.
liquid.thepeonypavilion-sp-cryofluid.name = Cryofluid
liquid.thepeonypavilion-sp-cryofluid.description = An efficient low-temperature coolant that noticeably speeds up turret fire rate.
liquid.thepeonypavilion-sp-slag.name = Slag
liquid.thepeonypavilion-sp-slag.description = Molten mineral waste at high temperature; can be recovered as scrap when cooled.
liquid.thepeonypavilion-sp-oil.name = Oil
liquid.thepeonypavilion-sp-oil.description = A viscous liquid buried in the earth; an important fuel and chemical feedstock.
liquid.thepeonypavilion-sp-hydrogen.name = Hydrogen
liquid.thepeonypavilion-sp-hydrogen.description = A flammable reducing gas. Besides being a clean energy source, it is important in chemical and metallurgical industries.

# -- New liquids (not in vanilla) --
liquid.thepeonypavilion-refined-oil.name = Refined Oil
liquid.thepeonypavilion-refined-oil.description = Crude oil purified of impurities; higher thermal efficiency.
liquid.thepeonypavilion-ethanol.name = Ethanol
liquid.thepeonypavilion-ethanol.description = A volatile, highly flammable organic solvent.
liquid.thepeonypavilion-oxygen.name = Oxygen
liquid.thepeonypavilion-oxygen.description = A chemically active strong oxidizer, important in chemical and metallurgical industries.
liquid.thepeonypavilion-natural-gas.name = Natural Gas
liquid.thepeonypavilion-natural-gas.description = A flammable, explosive gas of hydrocarbons buried in the earth. Separable from oil; used in power generation, agriculture and explosive manufacturing.

# -- Special blocks --
block.thepeonypavilion-sp-damaged-core.name = Damaged Core
block.thepeonypavilion-sp-damaged-core.description = The damaged core of the main fleet ship, most functions lost.
block.thepeonypavilion-sp-core-mk1.name = Type I Core
block.thepeonypavilion-sp-core-mk1.description = A basic core restored from the database, used to integrate resources across the planet and clear potential threats.
