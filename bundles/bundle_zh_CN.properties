# —— 变种液体（sp- 前缀）——
liquid.thepeonypavilion-sp-water.name = 水
liquid.thepeonypavilion-sp-water.description = 生命之源，几乎所有的冶炼与冷却流程都需要它。
liquid.thepeonypavilion-sp-cryofluid.name = 冷却液
liquid.thepeonypavilion-sp-cryofluid.description = 高效的低温冷却剂，可显著加快炮塔的射击速度。
liquid.thepeonypavilion-sp-slag.name = 矿渣
liquid.thepeonypavilion-sp-slag.description = 高温熔融的矿物废料，冷却后可回收为废料。
liquid.thepeonypavilion-sp-oil.name = 石油
liquid.thepeonypavilion-sp-oil.description = 蕴藏在地层中的粘稠液体，是重要的燃料与化工原料。
liquid.thepeonypavilion-sp-hydrogen.name = 氢气
liquid.thepeonypavilion-sp-hydrogen.description = 易燃的还原性气体，除了是一种清洁能源以外，在化工与冶金领域中也相当重要。

# —— 新增液体（原版没有）——
liquid.thepeonypavilion-refined-oil.name = 精炼燃油
liquid.thepeonypavilion-refined-oil.description = 原油经过提炼，去除杂质后的产物，具有更高的热效率。
liquid.thepeonypavilion-ethanol.name = 乙醇
liquid.thepeonypavilion-ethanol.description = 挥发性强，高度易燃的有机溶剂。
liquid.thepeonypavilion-oxygen.name = 氧气
liquid.thepeonypavilion-oxygen.description = 化学性质活泼的强氧化剂，在化工与冶金领域中相当重要。
liquid.thepeonypavilion-natural-gas.name = 天然气
liquid.thepeonypavilion-natural-gas.description = 主要由烃类组成的，蕴藏在地层中的易燃易爆气体，可从石油中分离出来，用于发电、农业或爆炸物的制造。

# —— 特殊建筑 ——
block.thepeonypavilion-sp-damaged-core.name = 受损核心
block.thepeonypavilion-sp-damaged-core.description = 受损的主舰核心，已丧失大部分功能。
block.thepeonypavilion-sp-core-mk1.name = I型核心
block.thepeonypavilion-sp-core-mk1.description = 从数据库中复原的基础型核心，用于整合开发行星各区域的资源，同时清扫可能存在的威胁。
