planet.thepeonypavilion-aldebaran.name = 毕宿四
planet.thepeonypavilion-aldebaran.description = 一颗橙巨星，金牛座中最明亮的恒星。牡丹亭星系的宿主恒星。
planet.thepeonypavilion-peony-pavilion.name = 牡丹亭
planet.thepeonypavilion-peony-pavilion.description = 一颗蓝绿色的星球。扫描显示这里存在一个充满敌意的流窜AI。
sector.thepeonypavilion-crash-site.name = 坠毁点
sector.thepeonypavilion-crash-site.description = 你的飞船在这里坠毁。残骸散落在四周，敌军正在逼近……从这里开始你的征程。

# ============================================
# 物品（键格式：item.thepeonypavilion-<内容名>.name / .description）
# ============================================

# —— 变种物品（sp- 前缀，原版资源的独立版本）——
item.thepeonypavilion-sp-lead.name = 铅
item.thepeonypavilion-sp-lead.description = 熔点低，密度大的重金属物质，对辐射及有害宇宙射线的吸收力极强，常被用于电力系统和辐射防护。
item.thepeonypavilion-sp-graphite.name = 石墨
item.thepeonypavilion-sp-graphite.description = 碳的同素异形体，韧性高、抗辐射，且耐腐蚀、高温，被广泛应用于冶金、机械、电子、军工等领域。
item.thepeonypavilion-sp-titanium.name = 钛
item.thepeonypavilion-sp-titanium.description = 坚固轻盈的金属，其物理性质优越，用途多样且广泛。
item.thepeonypavilion-sp-thorium.name = 钍
item.thepeonypavilion-sp-thorium.description = 较软且化学性质活泼的放射性金属，能量密度比铀更高的同时安全性也更佳，主要被用于核设施，或制造合金。
item.thepeonypavilion-sp-silicon.name = 硅
item.thepeonypavilion-sp-silicon.description = 在自然界中极常见的元素，具备优异的半导体特性，在电力系统，用电设备，计算机等绝大多数领域都不可或缺。
item.thepeonypavilion-sp-metaglass.name = 钢化玻璃
item.thepeonypavilion-sp-metaglass.description = 掺入铅提升结构强度的玻璃，主要用于流体运输和部分特殊设备中。
item.thepeonypavilion-sp-plastanium.name = 塑钢
item.thepeonypavilion-sp-plastanium.description = 钛与有机高分子材料的结合产物，质量较轻且抗腐蚀，具备绝缘特性，通常用于电力系统，计算机或有绝缘需求的设备。
item.thepeonypavilion-sp-blast-compound.name = 爆炸混合物
item.thepeonypavilion-sp-blast-compound.description = 多种常态下稳定的爆炸物的统称，在矿物开采及军工领域极其重要。
item.thepeonypavilion-sp-coal.name = 煤炭
item.thepeonypavilion-sp-coal.description = 蕴藏在地层中的可燃矿物，是早期最重要的燃料来源。
item.thepeonypavilion-sp-sand.name = 沙子
item.thepeonypavilion-sp-sand.description = 细碎的矿物颗粒，广泛分布于地表，可用于冶炼与建筑。
item.thepeonypavilion-sp-scrap.name = 废料
item.thepeonypavilion-sp-scrap.description = 各类建筑，工厂以及武器，军备的古老残骸，可从中提取少量有价值的原材料。

# —— 新增物品（原版没有，牡丹亭独有）——
# 基础
item.thepeonypavilion-iron.name = 铁
item.thepeonypavilion-iron.description = 质地坚硬且具备磁性的常见金属，被大量应用于各类建筑的结构中。
item.thepeonypavilion-cobalt.name = 钴
item.thepeonypavilion-cobalt.description = 略有脆性，但强度比铁更高，可用于运输系统和大多数合金。
item.thepeonypavilion-gold.name = 金
item.thepeonypavilion-gold.description = 导电性良好，质软的黄色贵金属，常被用于电力系统与精密元件。
item.thepeonypavilion-uranium.name = 铀
item.thepeonypavilion-uranium.description = 极其致密的放射性金属，在未被提纯的状态下放射性轻微，可用于建设防御工事或对材料强度有要求的设施。
item.thepeonypavilion-iridium.name = 铱
item.thepeonypavilion-iridium.description = （设计文档未填写）
# 合成
item.thepeonypavilion-steel.name = 钢
item.thepeonypavilion-steel.description = 硬度高韧性佳的铁碳合金，用途极其广泛。
item.thepeonypavilion-magnet.name = 永磁体
item.thepeonypavilion-magnet.description = 使用铁与钴制造的永磁合金，在磁力领域极为重要。
item.thepeonypavilion-computer-chip.name = 计算芯片
item.thepeonypavilion-computer-chip.description = 一块小巧的芯片，对几乎所有复杂设备而言不可或缺，且可以用于提升部分设备的运行效率。
item.thepeonypavilion-shinstar-alloy.name = 耀星合金
item.thepeonypavilion-shinstar-alloy.description = 由钢、钴、钛制成的高强度合金，质量较轻但极其坚硬，可承受巨大的冲击或压力，适合用于军工领域或部分特种设备，以及最重要的——制造星舰。
item.thepeonypavilion-raindawn-salt.name = 虹霞盐
item.thepeonypavilion-raindawn-salt.description = 意外发现的高能物质，可由铀、钍、石墨人工合成，其能量密度极高，且具备优秀的储能性质，适合制造高能武器或建设发电，储电设施。
item.thepeonypavilion-sunshine-crystal-lattice.name = 灿阳晶格
item.thepeonypavilion-sunshine-crystal-lattice.description = 将铅、硅、金编织在一起，就会产生这种闪烁着缤纷流光的，在宏观尺度表现出类似晶格状的材料，它具有许多奇妙的性质，可用于制造各类投影、护盾装置或高能武器。
item.thepeonypavilion-autocannon-ammo.name = 机炮弹药箱
item.thepeonypavilion-autocannon-ammo.description = 用于轻型与速射武器的标准弹药箱，性能远超普通材料弹药。
item.thepeonypavilion-artillery-ammo.name = 炮弹弹药箱
item.thepeonypavilion-artillery-ammo.description = 用于重型与抛射武器的标准弹药箱，性能远超普通材料弹药。
item.thepeonypavilion-missile-ammobox.name = 导弹弹药箱
item.thepeonypavilion-missile-ammobox.description = 用于重型与导弹武器的标准弹药箱，性能远超普通材料弹药。
item.thepeonypavilion-uranium-fuelrod.name = 铀燃料棒
item.thepeonypavilion-uranium-fuelrod.description = 经过提纯，使用铅封装以隔绝辐射的高浓度铀，应用于核设施或高能武器/设备。
item.thepeonypavilion-thorium-fuelrod.name = 钍燃料棒
item.thepeonypavilion-thorium-fuelrod.description = 经过提纯，使用铅封装以隔绝辐射的高浓度钍，应用于核设施或高能武器/设备，其能量密度比铀燃料棒更高。
item.thepeonypavilion-lead-capacitor.name = 铅电容
item.thepeonypavilion-lead-capacitor.description = 小容量的一次性电容，用于跨区域输电，也可用于部分武器。
item.thepeonypavilion-nuclear-capacitor.name = 核能电容
item.thepeonypavilion-nuclear-capacitor.description = 中等容量的一次性电容，用于跨区域输电，也可用于部分武器。
item.thepeonypavilion-super-capacitor.name = 超级电容
item.thepeonypavilion-super-capacitor.description = 大容量的一次性电容，用于跨区域输电，也可用于部分武器。
item.thepeonypavilion-data-unit.name = 数据单元
item.thepeonypavilion-data-unit.description = 装有复原数据的存储设备，用于复原数据库内的科技。
item.thepeonypavilion-advanced-data-unit.name = 高级数据单元
item.thepeonypavilion-advanced-data-unit.description = 装有复杂复原数据的存储设备，用于复原数据库内的高级科技。
# 自然
item.thepeonypavilion-salt.name = 盐
item.thepeonypavilion-salt.description = 咸味的矿物结晶，广泛存在于地表与矿脉中。
item.thepeonypavilion-wood.name = 木材
item.thepeonypavilion-wood.description = 植物的木质化组织，可用于支撑简单的结构或作为燃料，还可通过生化反应制出乙醇。
item.thepeonypavilion-sulfide.name = 硫化物
item.thepeonypavilion-sulfide.description = 富含硫的矿物，是制造爆炸物的关键原料。
item.thepeonypavilion-crystal.name = 水晶
item.thepeonypavilion-crystal.description = 主要由二氧化硅组成的天然晶体，可直接提炼为高质量的硅。
item.thepeonypavilion-ice.name = 冰
item.thepeonypavilion-ice.description = 因低温而冻结的固态水，只需简单加热即可获取可用的水资源。

